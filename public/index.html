<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citizen portal</title>
    <script src="webmcp.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Government of Mexico</div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>National citizen registry</h1>
            <p>Welcome to the official portal. Verify your identity using our AI agent integration.</p>
        </section>

        <section class="verification-section">
            <h2>Recent verifications</h2>
            <div id="verified-items" class="verified-items-container">
                <p class="empty-msg">No citizens verified yet.</p>
            </div>
        </section>
    </main>
    <script src="app.js"></script>
</body>
</html>
